[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ventilation-company"
version = "2.0.0"
description = "Комплексна система управління проєктами для вентиляційної виробничої фірми"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "fpdf2>=2.7.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    "pywebview>=4.4.0",
    "pyautocad>=0.2.0",
]

[project.scripts]
vent-firm-gui = "main_pyside6:main"

[tool.setuptools]
py-modules = ["main_pyside6"]

[tool.setuptools.packages.find]
include = ["ventilation_company*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["venv", ".venv", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E9", "F821", "F401", "I001"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff.lint.isort]
known-first-party = ["ventilation_company"]
