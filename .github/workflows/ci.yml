name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy (services layer)
        run: mypy ventilation_company/services/

      - name: Pytest (no PostgreSQL needed — tests use fakes/SQLite)
        env:
          QT_QPA_PLATFORM: minimal   # headless Qt на ранері — стабільніше для GUI-тестів
        run: pytest -v --tb=short
