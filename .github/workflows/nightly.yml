name: Nightly tests

# Щоночний контроль здоров'я репозиторія: повний прогін тестів без пушу.
# При падінні — відкривається Issue з міткою nightly-failure (дублікати не плодяться).

on:
  schedule:
    # 04:17 UTC щодня (поза піковими хвилинами 0/30)
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest (повний прогін)
        env:
          QT_QPA_PLATFORM: minimal
        run: pytest -v --tb=short

      - name: Створити Issue при падінні
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Повторне падіння нічного прогону: ${context.runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Нічний прогін тестів впав (${new Date().toISOString().slice(0, 10)})`,
              body: `Нічний прогін тестів невдалий: ${context.runUrl}\n\nЗапустіть CI вручну або перевірте останні зміни.`,
              labels: [label],
            });
